services:
  voicebox:
    build: .
    container_name: voicebox
    restart: unless-stopped
    ports:
      - "17493:17493"
    volumes:
      - voicebox-output:/app/data/generations
      - voicebox-data:/app/data
      - huggingface-cache:/home/voicebox/.cache/huggingface
    environment:
      - LOG_LEVEL=info
      - NUMBA_CACHE_DIR=/tmp/numba_cache
      - VOICEBOX_CORS_ORIGINS=https://voicebox.yourdomain.com
      - VOICEBOX_FORCE_CPU=1
    networks:
      - coolify

networks:
  coolify:
    external: true

volumes:
  voicebox-output:
  voicebox-data:
  huggingface-cache:
